# Afterhours 16 online server: network settings for many small messages that can't wait (installed to
# /etc/sysctl.d/90-afterhours16.conf by  afterhours16 tune , which the game service runs each time it starts)
# fq + BBR: short queues under load
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
# no slow restart after a quiet moment: the next input goes out at full speed
net.ipv4.tcp_slow_start_after_idle = 0
# little unsent data held in the kernel per socket (the game keeps its own queue per player and sees one fall behind)
net.ipv4.tcp_notsent_lowat = 131072
# quicker reconnects, and room for a crowd connecting at once
net.ipv4.tcp_fastopen = 3
net.core.somaxconn = 1024
